<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>INFINITE LIGHTING — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://ejjlcuyfqjrwiibqqqua.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <style>
    :root { --teal:#14b8a6; --teal-d:#0d9488; --teal-dd:#0f766e; --indigo:#4f46e5; --slate-50:#f8fafc; --slate-200:#e2e8f0; --slate-300:#cbd5e1; --slate-400:#94a3b8; --slate-500:#64748b; --slate-900:#0f172a; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; }
    html,body { touch-action:pan-x pan-y; -webkit-text-size-adjust:100%; }
    body { min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
      background:radial-gradient(1200px 400px at 10% -10%,#ecfeff,transparent 60%),radial-gradient(900px 400px at 100% 0,#f0fdfa,transparent 55%),#f1f5f9; color:var(--slate-900); }
    .wrap { width:100%; max-width:448px; }
    .card { background:#fff; border:1px solid var(--slate-200); border-radius:16px; box-shadow:0 20px 40px -20px rgba(15,23,42,.25); overflow:hidden; animation:fade .25s ease both; }
    header { position:relative; color:#fff; padding:24px; background:linear-gradient(0deg,#0f172a,#1e293b,#0f172a); display:flex; align-items:center; gap:12px; }
    header::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(135deg,var(--teal),var(--teal-d) 55%,var(--indigo)); }
    .dot { width:10px; height:10px; border-radius:50%; background:#2dd4bf; box-shadow:0 0 0 0 rgba(45,212,191,.6); animation:ping 1.6s infinite; }
    h1 { font-size:20px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    header p { font-size:11px; color:var(--slate-400); font-weight:500; margin-top:2px; }
    form { padding:28px 32px; display:flex; flex-direction:column; gap:20px; }
    h2 { font-size:18px; font-weight:800; }
    .sub { font-size:12px; color:var(--slate-500); font-weight:500; margin-top:4px; }
    label { display:block; font-size:11px; font-weight:700; color:var(--slate-500); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
    .field { display:flex; align-items:center; border:1px solid var(--slate-300); border-radius:12px; background:#fff; box-shadow:0 1px 2px rgba(15,23,42,.05); overflow:hidden; transition:box-shadow .15s,border-color .15s; }
    .field:focus-within { border-color:var(--teal-d); box-shadow:0 0 0 3px rgba(20,184,166,.18); }
    .field svg { width:16px; height:16px; margin-left:14px; color:var(--slate-400); flex:none; }
    .field input { flex:1; min-width:0; border:0; outline:0; background:transparent; padding:12px; font-size:16px; font-weight:600; color:#1e293b; min-height:44px; }
    .field input::placeholder { font-weight:400; color:var(--slate-400); }
    .eye { border:0; background:transparent; color:var(--slate-400); min-width:44px; min-height:44px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .eye svg { margin:0; width:20px; height:20px; }
    .eye:hover { color:#334155; }
    .hidden { display:none !important; }
    .msg { border-radius:12px; font-size:12px; font-weight:600; padding:12px 16px; }
    .msg.err { background:#fff1f2; border:1px solid #fecdd3; color:#be123c; }
    .msg.ok { background:#ecfdf5; border:1px solid #a7f3d0; color:#047857; }
    .caps { font-size:11px; font-weight:600; color:#d97706; margin-top:6px; padding:0 4px; }
    .btn { width:100%; min-height:48px; border:0; border-radius:12px; color:#fff; font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
      background:linear-gradient(135deg,var(--teal),var(--indigo)); transition:filter .15s,transform .15s; }
    .btn:hover:not(:disabled) { filter:brightness(1.08); }
    .btn:active:not(:disabled) { transform:translateY(1px); }
    .btn:disabled { opacity:.7; cursor:not-allowed; }
    .spin { width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; }
    .row { display:flex; align-items:center; justify-content:space-between; }
    .link { background:none; border:0; color:var(--teal-dd); font-size:12px; font-weight:700; cursor:pointer; }
    .link:hover { text-decoration:underline; }
    .small { font-size:10.5px; color:var(--slate-400); font-weight:500; }
    .foot { text-align:center; font-size:11px; color:var(--slate-400); font-weight:500; margin-top:16px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    @keyframes ping { 70%,100% { box-shadow:0 0 0 8px rgba(45,212,191,0); } }
    @media (max-width:639px) { body { padding:0; } .card { border-radius:0; border-left:0; border-right:0; box-shadow:none; } .foot { display:none; } form { padding:24px 20px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <span class="dot"></span>
        <div>
          <h1>INFINITE LIGHTING</h1>
          <p>Inventory Control · Secure Access</p>
        </div>
      </header>

      <form id="loginForm" novalidate>
        <div>
          <h2>Sign in</h2>
          <p class="sub">Authorized security users only.</p>
        </div>

        <div id="msgBox" class="msg err hidden" role="alert"></div>

        <div>
          <label for="email">Email</label>
          <div class="field">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l9 6 9-6M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="you@company.com">
          </div>
        </div>

        <div>
          <label for="password">Password</label>
          <div class="field">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4"/></svg>
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
            <button type="button" id="togglePw" class="eye" aria-label="Show password">
              <svg id="eyeOn" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg id="eyeOff" class="hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M3 3l18 18"/></svg>
            </button>
          </div>
          <p id="capsHint" class="caps hidden">Caps Lock is on</p>
        </div>

        <button id="submitBtn" type="submit" class="btn"><span id="btnLabel">Sign In</span></button>

        <div class="row">
          <button type="button" id="forgotBtn" class="link">Forgot password?</button>
          <span class="small">Protected by Supabase Auth</span>
        </div>
      </form>
    </div>
    <p class="foot">© Infinite Lighting · Inventory Control</p>
  </div>

  <script>
    // ====== CONFIG ======
    const SUPABASE_URL = 'https://ejjlcuyfqjrwiibqqqua.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_cGg6RYwncIeCROpUsy4K1g_Hphm28-i';
    const APP_URL      = 'index.html';   // <- the inventory page to open after login
    // ====================

    const $ = (id) => document.getElementById(id);
    const emailEl = $('email'), pwEl = $('password'), btn = $('submitBtn'), label = $('btnLabel'), msg = $('msgBox');
    let sb = null;

    function getClient() {
      if (sb) return sb;
      if (typeof supabase === 'undefined') return null;
      sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
      return sb;
    }

    // Fast pre-check (no network): if a saved Supabase session token exists, skip the form.
    (function quickRedirect() {
      try {
        const ref = new URL(SUPABASE_URL).hostname.split('.')[0];
        const raw = localStorage.getItem('sb-' + ref + '-auth-token');
        if (raw) {
          const s = JSON.parse(raw);
          if (s && s.expires_at && s.expires_at * 1000 > Date.now()) window.location.replace(APP_URL);
        }
      } catch (e) {}
    })();

    function show(text, kind) { msg.textContent = text; msg.className = 'msg ' + (kind || 'err'); }
    function clearMsg() { msg.className = 'msg err hidden'; msg.textContent = ''; }
    function busy(on, text) {
      btn.disabled = on; label.textContent = text;
      const s = btn.querySelector('.spin');
      if (on && !s) { const el = document.createElement('span'); el.className = 'spin'; btn.prepend(el); }
      if (!on && s) s.remove();
    }
    function friendly(err) {
      const m = (err && err.message || '').toLowerCase();
      if (m.includes('invalid login')) return 'Incorrect email or password.';
      if (m.includes('email not confirmed')) return 'This account is not confirmed yet. Contact your administrator.';
      if (m.includes('rate limit') || m.includes('too many')) return 'Too many attempts. Wait a minute and try again.';
      if (m.includes('failed to fetch') || m.includes('network')) return 'Cannot reach the server. Check your internet connection.';
      return (err && err.message) || 'Sign-in failed. Please try again.';
    }

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault(); clearMsg();
      const email = emailEl.value.trim(), password = pwEl.value;
      if (!email || !password) { show('Please enter your email and password.'); return; }
      const client = getClient();
      if (!client) { show('Still loading, please try again in a moment.'); return; }
      busy(true, 'Signing in...');
      try {
        const { error } = await client.auth.signInWithPassword({ email, password });
        if (error) { show(friendly(error)); pwEl.value = ''; pwEl.focus(); busy(false, 'Sign In'); return; }
        busy(true, 'Success — loading...');
        window.location.replace(APP_URL);
      } catch (err) { show(friendly(err)); busy(false, 'Sign In'); }
    });

    $('togglePw').addEventListener('click', () => {
      const showPw = pwEl.type === 'password';
      pwEl.type = showPw ? 'text' : 'password';
      $('eyeOn').classList.toggle('hidden', showPw);
      $('eyeOff').classList.toggle('hidden', !showPw);
      $('togglePw').setAttribute('aria-label', showPw ? 'Hide password' : 'Show password');
    });

    pwEl.addEventListener('keyup', (e) => $('capsHint').classList.toggle('hidden', !(e.getModifierState && e.getModifierState('CapsLock'))));
    pwEl.addEventListener('blur', () => $('capsHint').classList.add('hidden'));

    $('forgotBtn').addEventListener('click', async () => {
      clearMsg();
      const email = emailEl.value.trim();
      if (!email) { show('Enter your email above first, then tap "Forgot password?".'); emailEl.focus(); return; }
      const client = getClient();
      if (!client) { show('Still loading, please try again in a moment.'); return; }
      try {
        const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
        if (error) { show(friendly(error)); return; }
        show('If that email is registered, a password reset link has been sent.', 'ok');
      } catch (err) { show(friendly(err)); }
    });

    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  </script>
</body>
</html>
